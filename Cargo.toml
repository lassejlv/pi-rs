# Vendored crates with local fixes (see vendor/<crate>/PATCH.md).
[patch.crates-io]
boa_engine = { path = "vendor/boa_engine" }
boa_ast = { path = "vendor/boa_ast" }
boa_parser = { path = "vendor/boa_parser" }

# Release builds: one codegen unit with fat LTO lets LLVM drop and merge code across the
# workspace's large dependency graph (Boa, oxc, ICU4X, RustCrypto, wasmi, rustls), and symbols are
# stripped. Code is optimized for size, except the hot paths, which keep full speed optimization:
# the TUI renderer, the JavaScript runtime with its engine and TypeScript stripper, regex engines,
# JSON, hash tables, crypto, WebAssembly and compression. Measured on x86-64 Linux, the binary is
# about a fifth smaller than with `opt-level = 3` everywhere while loading extensions ~5% slower;
# `opt-level = "s"` everywhere saves a few MB more but loads extensions ~15% slower.
# `panic = "unwind"` stays: tools, extensions and UI callbacks are guarded with `catch_unwind`.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"

