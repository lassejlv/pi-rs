[package]
name = "pi-ai"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pi-telemetry = { workspace = true }
pi-json = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
indexmap = { workspace = true }
hmac = { workspace = true }
rsa = { workspace = true }
crc32fast = { workspace = true }
sha1 = { workspace = true }
ruzstd = { workspace = true }
# std::time clocks on native; the JavaScript clock on wasm32, where std::time panics.
web-time = "1.1"

# Native builds use the workspace tokio ("full") and native WebSockets. wasm32
# gets the portable tokio subset, reqwest's fetch backend, JavaScript-hosted
# randomness and a microtask executor (see utils/wasm.rs); OS-bound features
# (OAuth callback server, process credentials, files, proxies, websockets) are
# compiled out there. Native builds are unchanged.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
# ring's C/assembly core needs a wasm-capable C toolchain; its one use (AWS
# login DPoP signing) is native-only.
ring = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "io-util"] }
getrandom = { version = "0.2", features = ["js"] }
uuid = { workspace = true, features = ["js"] }
wasm-bindgen-futures = "0.4.79"
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
