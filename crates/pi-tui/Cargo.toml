[package]
name = "pi-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal User Interface library with differential rendering (Rust port of @earendil-works/pi-tui)"

[dependencies]
unicode-segmentation.workspace = true
icu_segmenter.workspace = true
icu_collator.workspace = true
regex.workspace = true
fancy-regex.workspace = true
libc.workspace = true
base64.workspace = true
url.workspace = true
# Native clipboard (TS: prebuilt clipboard addons); pure Rust on X11, macOS and Windows.
arboard = { version = "~3.6.1", default-features = false, features = ["image-data"] }
image.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
