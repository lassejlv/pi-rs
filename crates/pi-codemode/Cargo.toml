[package]
name = "pi-codemode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandboxed JavaScript execution where the only capability is calling injected tools"

[dependencies]
jiff.workspace = true
pi-quickjs.workspace = true
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_span.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
pi-json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
indexmap.workspace = true
libc.workspace = true

# Native builds use the workspace tokio ("full"); wasm32 gets the portable subset
# subset.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time"] }

[dev-dependencies]
tokio = { workspace = true }
